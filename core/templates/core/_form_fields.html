{% if form.non_field_errors %}
  <div class="platform-form-errors" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="platform-form-field{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
    {% if field.errors %}<div class="platform-field-errors" role="alert">{{ field.errors }}</div>{% endif %}
  </div>
{% endfor %}
