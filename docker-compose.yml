services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.${APP_ENV:-dev}
      - path: .env.${APP_ENV:-dev}.local
        required: false
    volumes:
      - .:/app
      - media_data:/data/media
      - static_data:/data/static
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.${APP_ENV:-dev}
      - path: .env.${APP_ENV:-dev}.local
        required: false
    volumes:
      - .:/app
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "iatramp", "worker", "--loglevel=info", "--concurrency=1"]

  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env.${APP_ENV:-dev}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

volumes:
  db_data:
  media_data:
  static_data:
